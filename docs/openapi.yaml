openapi: 3.0.3
info:
  title: API pública de indicadores — Auditoria Cidadã dos Ônibus de São Paulo
  version: 1.2.0
  description: >-
    Contrato para consulta pública, sem autenticação, de indicadores operacionais
    publicados e suas séries temporais. Sem valores publicados, as rotas retornam
    uma página vazia. Valores devem declarar unidade, janela, versão do conjunto
    e qualidade; os serviços produtores das dependências US14-T03B e US16-T02
    são responsáveis por gravar os valores calculados.
    GET e HEAD de /indicadores, /series e /mapas/indicadores compartilham 60 chamadas por IP por
    minuto UTC (janela fixa). A 61ª chamada retorna 429 com Retry-After em
    segundos. Parâmetros inválidos também consomem a cota; OPTIONS não consome.
    O IP vem da conexão; X-Forwarded-For só é considerado atrás de proxies
    explicitamente confiáveis. Falha no armazenamento do limite retorna 503.
    Guia público com exemplos e evidência de desempenho em /docs/indicadores.
servers:
  - url: http://localhost:5000
paths:
  /docs/indicadores:
    get:
      operationId: lerGuiaPublicoIndicadores
      summary: Guia público, exemplos de consumo e limites do ensaio HTTP.
      security: []
      responses:
        '200':
          description: Documentação HTML; não consome a cota de consultas.
          content:
            text/html:
              schema: { type: string }
  /docs/indicadores/openapi.yaml:
    get:
      operationId: baixarContratoIndicadores
      summary: Contrato OpenAPI versionado desta API.
      security: []
      responses:
        '200':
          description: Arquivo YAML; não consome a cota de consultas.
          content:
            application/yaml:
              schema: { type: string }
  /docs/indicadores/ensaio.json:
    get:
      operationId: lerEnsaioHTTPIndicadores
      summary: Amostra e ambiente do ensaio HTTP local com dados sintéticos.
      security: []
      responses:
        '200':
          description: Evidência estática versionada, não uma medição em tempo real da produção.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /downloads/indicadores:
    get:
      operationId: baixarIndicadoresCSV
      summary: Baixar indicadores diários consolidados em CSV
      description: >-
        Serve o arquivo diário publicado após a consolidação US23-T03. Informe
        `data` ou `inicio` e `fim` dentro do mesmo dia de America/Sao_Paulo.
        Pode filtrar linha, sentido e tipo. O dia só é anunciado após a
        consolidação e publicação; enquanto indisponível, a API retorna JSON
        404, nunca um CSV vazio de sucesso. Disponibilidade prevista até 06:00
        de D+1 no horário de São Paulo. Os tipos públicos de /indicadores valem
        aqui: ESPERA = ESPERA_ESTIMADA + EXCESSO_ESPERA; FREQUENCIA = observada +
        programada. Licença CC BY 4.0; cada linha traz as colunas `fonte` e
        `licenca`; as condições da SPTrans estão em /downloads/indicadores/metadados.
        US25-T01: com `versao_dados` (recebido em /series ou /indicadores), exporta
        exatamente a versão exibida, recomposta dos conjuntos preservados de cada
        publicação, com a seleção de /series (janelas inteiramente contidas, faixa
        `hora_inicio`/`hora_fim` e, sem parada/trecho, só a linha inteira). Nesse modo
        o período pode cruzar dias (até 31) e o dia não precisa estar consolidado.
        Nunca substitui a versão pedida pela mais recente.
      security: []
      parameters:
        - name: versao_dados
          in: query
          required: false
          description: >-
            `versao_dados.id` da resposta de /series. Ausente: comportamento US10
            (arquivo diário consolidado).
          schema: { type: string, format: uuid }
        - name: hora_inicio
          in: query
          required: false
          description: Somente com versao_dados; mesma regra de /series (HH:MM, junto com hora_fim).
          schema: { type: string, pattern: '^(?:[01][0-9]|2[0-3]):[0-5][0-9]$' }
        - name: hora_fim
          in: query
          required: false
          description: Somente com versao_dados; mesma regra de /series.
          schema: { type: string, pattern: '^(?:[01][0-9]|2[0-3]):[0-5][0-9]$' }
        - name: formato
          in: query
          required: true
          description: Formato de saída.
          schema: { type: string, enum: [csv] }
        - name: data
          in: query
          required: false
          description: Dia operacional AAAA-MM-DD em America/Sao_Paulo; exclusivo com inicio/fim.
          schema: { type: string, format: date }
        - $ref: '#/components/parameters/linha'
        - $ref: '#/components/parameters/sentido'
        - $ref: '#/components/parameters/tipo'
        - $ref: '#/components/parameters/indicador'
        - $ref: '#/components/parameters/parada'
        - $ref: '#/components/parameters/trecho'
        - $ref: '#/components/parameters/versao_gtfs_id'
        - $ref: '#/components/parameters/inicio'
        - $ref: '#/components/parameters/fim'
      responses:
        '200':
          description: CSV filtrado de um dia consolidado; campos vazios representam nulos.
          headers:
            X-Fonte: { schema: { type: string } }
            X-Fonte-URL: { schema: { type: string, format: uri } }
            X-Licenca: { schema: { type: string } }
            X-Licenca-URL: { schema: { type: string, format: uri } }
            X-Disponibilizado-Em: { schema: { type: string, format: date-time }, description: Instante de publicação do arquivo diário. }
            X-Total-Registros: { schema: { type: integer, minimum: 0 } }
            X-Versao-Dados: { schema: { type: string, format: uuid }, description: Somente com versao_dados; a versão exportada. }
            X-Versao-Publicada-Em: { schema: { type: string, format: date-time }, description: Somente com versao_dados. }
            Link: { schema: { type: string }, description: Link rel=describedby para os metadados do arquivo. }
          content:
            text/csv:
              schema: { type: string, format: binary }
        '400': { $ref: '#/components/responses/ParametroInvalido' }
        '404':
          description: >-
            Consolidação ainda não publicada ou indisponível; com versao_dados,
            `VERSAO_INEXISTENTE` (não há publicação com esse id).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
        '410':
          description: >-
            `VERSAO_INDISPONIVEL`: a versão existiu mas não pode ser reproduzida.
            `motivo` = `ARQUIVO_AUSENTE_OU_INVALIDO` (conjunto preservado removido,
            expirado ou sem conferir com o recibo; `publicacao` indica qual) ou
            `PERIODO_NAO_PRESERVADO` (o período tinha indicadores publicados fora da agenda).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
              example:
                erro: { codigo: VERSAO_INDISPONIVEL, mensagem: 'O conjunto preservado desta versão não está mais disponível ou não confere com o recibo.', versao_dados: 'f3b1c0de-2a4b-4c5d-8e9f-0123456789ab', motivo: ARQUIVO_AUSENTE_OU_INVALIDO }
        '503':
          description: Não foi possível verificar ou ler o arquivo publicado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
  /downloads/indicadores/metadados:
    get:
      operationId: consultarMetadadosCSVIndicadores
      summary: Consultar fonte, condições de uso e formato do CSV
      security: []
      responses:
        '200':
          description: Metadados aplicáveis ao download CSV.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /indicadores:
    get:
      operationId: listarIndicadores
      summary: Consultar indicadores operacionais
      security: []
      parameters:
        - $ref: '#/components/parameters/linha'
        - $ref: '#/components/parameters/sentido'
        - $ref: '#/components/parameters/tipo'
        - $ref: '#/components/parameters/indicador'
        - $ref: '#/components/parameters/parada'
        - $ref: '#/components/parameters/trecho'
        - $ref: '#/components/parameters/versao_gtfs_id'
        - $ref: '#/components/parameters/inicio'
        - $ref: '#/components/parameters/fim'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/page_size'
        - $ref: '#/components/parameters/agregacao'
        - $ref: '#/components/parameters/hora_inicio'
        - $ref: '#/components/parameters/hora_fim'
      responses:
        '200':
          description: Página de indicadores publicados.
          headers:
            X-RateLimit-Limit: { $ref: '#/components/headers/Limite' }
            X-RateLimit-Remaining: { $ref: '#/components/headers/Restantes' }
            X-RateLimit-Reset: { $ref: '#/components/headers/Reinicio' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaIndicadores'
              example:
                dados:
                  - linha: '3762-10'
                    sentido: '0'
                    tipo: PONTUALIDADE_VIAGENS
                    indicador: PONTUALIDADE_VIAGENS
                    valor: 87.5
                    unidade: '%'
                    inicio: '2026-11-23T00:00:00Z'
                    fim: '2026-11-24T00:00:00Z'
                    parada: null
                    trecho: null
                    versao_conjunto: 'a02cbb7d2f77623f099e4d1192030e9b'
                    versao_gtfs_id: 'b2c21816-0b5b-4fac-9e14-2406fc7b591a'
                    versao_correspondencia: 'match-v3'
                    versao_calculo: 'cumprimento-1.0'
                    contagens: { numerador: 7, denominador: 8 }
                    qualidade: { dados_insuficientes: false, limite_adiantamento_segundos: 60, limite_atraso_segundos: 300, limites_inclusivos: true, excluidas: { frequencia: 2, sem_pareamento: 1, saida_nao_confirmada: 0 } }
                paginacao: { page: 1, page_size: 100, total: 1 }
        '400': { $ref: '#/components/responses/ParametroInvalido' }
        '429': { $ref: '#/components/responses/LimiteExcedido' }
        '503': { $ref: '#/components/responses/Indisponivel' }
  /series:
    get:
      operationId: consultarSeries
      summary: Consultar série temporal de indicador
      description: >-
        US23-T01. Somente janelas persistidas inteiramente contidas no período
        [inicio,fim) e na faixa diária em America/Sao_Paulo. Sem período consulta
        desde o início conhecido da coleta. Não recalcula nem fatia agregados.
        Zero é valor; null é ausência. Lacunas acompanham os registros da página,
        considerando registros anteriores à paginação e sobreposições. Até 200
        lacunas por página; consulta.lacunas_truncadas pede reduzir o período.
      security: []
      parameters:
        - $ref: '#/components/parameters/hora_inicio'
        - $ref: '#/components/parameters/hora_fim'
        - $ref: '#/components/parameters/linha'
        - $ref: '#/components/parameters/sentido'
        - $ref: '#/components/parameters/tipo'
        - $ref: '#/components/parameters/indicador'
        - $ref: '#/components/parameters/parada'
        - $ref: '#/components/parameters/trecho'
        - $ref: '#/components/parameters/versao_gtfs_id'
        - $ref: '#/components/parameters/inicio'
        - $ref: '#/components/parameters/fim'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/page_size'
      responses:
        '200':
          description: Página de pontos da série publicada.
          headers:
            X-RateLimit-Limit: { $ref: '#/components/headers/Limite' }
            X-RateLimit-Remaining: { $ref: '#/components/headers/Restantes' }
            X-RateLimit-Reset: { $ref: '#/components/headers/Reinicio' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaSeries'
              example:
                dados:
                  - instante: '2026-11-23T12:00:00Z'
                    id: '7c1beb67-96eb-4f1a-8043-b0ec9aeb75f0'
                    status: DISPONIVEL
                    inicio: '2026-11-23T12:00:00Z'
                    fim: '2026-11-23T13:00:00Z'
                    linha: '3762-10'
                    sentido: '0'
                    tipo: PONTUALIDADE_VIAGENS
                    indicador: PONTUALIDADE_VIAGENS
                    valor: 87.5
                    unidade: '%'
                    parada: null
                    trecho: null
                    versao_conjunto: '2026-11-v1'
                    versao_gtfs_id: 'b2c21816-0b5b-4fac-9e14-2406fc7b591a'
                    versao_correspondencia: 'match-v3'
                    versao_calculo: 'cumprimento-1.0'
                    contagens: { numerador: 7, denominador: 8 }
                    qualidade: { dados_insuficientes: false, limite_adiantamento_segundos: 60, limite_atraso_segundos: 300, limites_inclusivos: true, excluidas: { frequencia: 2, sem_pareamento: 1, saida_nao_confirmada: 0 } }
                paginacao: { page: 1, page_size: 100, total: 1 }
                lacunas: []
                historico: { coleta_inicio: null, coleta_ultimo_ciclo: null, inicio_indicadores: '2026-11-23T12:00:00Z', fim_indicadores: '2026-11-23T13:00:00Z' }
                consulta: { inicio: '2026-11-23T12:00:00Z', fim: '2026-11-23T13:00:00Z', hora_inicio: null, hora_fim: null, fuso: America/Sao_Paulo, lacunas_escopo: PAGINA, lacunas_truncadas: false, criterio_periodo: JANELAS_INTEIRAMENTE_CONTIDAS }
        '400': { $ref: '#/components/responses/ParametroInvalido' }
        '429': { $ref: '#/components/responses/LimiteExcedido' }
        '503': { $ref: '#/components/responses/Indisponivel' }
  /mapas/indicadores:
    get:
      operationId: consultarIndicadoresComGeometria
      summary: Consultar indicadores como GeoJSON e agregar por distrito ou subprefeitura
      description: >-
        Retorna FeatureCollection GeoJSON em EPSG:4326. `escopo` aceita parada,
        trecho, distrito ou subprefeitura. Informe `versao_gtfs_id` para fixar
        a rede e evitar mistura entre versões; para unidades territoriais, informe
        `base=parada` ou `base=trecho`. Agregações somam numeradores e
        denominadores por tipo, janela, sentido e versões compatíveis antes de
        calcular o percentual. Não calcula média de valores percentuais. Em
        trechos fronteiriços, US24-T01 atribui o trecho à unidade com maior
        extensão sobreposta; a geometria permanece a linha completa. Uma versão
        territorial é escolhida pela captura mais recente ou fixada por ID.
        Dados sem território aparecem nas consultas por parada/trecho com os
        IDs territoriais nulos; denominador zero resulta em valor null. Se há
        resultados em parte do mapa, unidades sem observações também são
        incluídas com valor null e ausencia SEM_DADOS.
      security: []
      parameters:
        - name: escopo
          in: query
          required: true
          schema: { type: string, enum: [parada, trecho, distrito, subprefeitura] }
        - name: base
          in: query
          required: false
          description: Obrigatória para distrito/subprefeitura; qual dimensão espacial será somada.
          schema: { type: string, enum: [parada, trecho] }
        - name: codigo
          in: query
          required: false
          description: Código da parada, ID do trecho ou código da unidade territorial segundo escopo.
          schema: { type: string, maxLength: 64 }
        - name: versao_territorial_id
          in: query
          required: false
          description: UUID da versão dos limites; omitido, usa a captura mais recente.
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/linha'
        - $ref: '#/components/parameters/sentido'
        - $ref: '#/components/parameters/tipo'
        - $ref: '#/components/parameters/indicador'
        - name: versao_gtfs_id
          in: query
          required: true
          description: UUID da rede consultada; evita misturar entidades entre versões GTFS.
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/inicio'
        - $ref: '#/components/parameters/fim'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/page_size'
      responses:
        '200':
          description: FeatureCollection GeoJSON; `ausencia` e valor null explicitam lacunas ou ausência de denominador.
          headers:
            X-RateLimit-Limit: { $ref: '#/components/headers/Limite' }
            X-RateLimit-Remaining: { $ref: '#/components/headers/Restantes' }
            X-RateLimit-Reset: { $ref: '#/components/headers/Reinicio' }
          content:
            application/geo+json:
              schema:
                type: object
                required: [type, features, legenda, paginacao]
                properties:
                  type: { type: string, enum: [FeatureCollection] }
                  features:
                    type: array
                    items:
                      type: object
                      required: [type, geometry, properties]
                      properties:
                        type: { type: string, enum: [Feature] }
                        geometry: { type: object, description: Geometria GeoJSON EPSG:4326. }
                        properties: { type: object, additionalProperties: true }
                  legenda: { type: object, additionalProperties: true }
                  versao_territorial: { type: object, nullable: true, additionalProperties: true }
                  ausencia: { type: string, nullable: true }
                  paginacao: { $ref: '#/components/schemas/Paginacao' }
              example:
                type: FeatureCollection
                features:
                  - type: Feature
                    geometry: { type: Polygon, coordinates: [[[ -46.64, -23.56 ], [ -46.63, -23.56 ], [ -46.63, -23.55 ], [ -46.64, -23.56 ]]] }
                    properties:
                      codigo: '78'
                      nome: SE
                      escopo: distrito
                      base_agregacao: parada
                      tipo: PONTUALIDADE_VIAGENS
                      unidade: '%'
                      valor: 87.5
                      contagens: { numerador: 7, denominador: 8 }
                      ausencia: null
                legenda: { unidade: unidade original do indicador, agregacao: somar contagens antes de calcular o percentual }
                versao_territorial: { id: 'a3d25d94-686b-4ee8-b364-c73997d8724c', fonte: GeoSampa, versao_fonte: '2026-11-16' }
                ausencia: null
                paginacao: { page: 1, page_size: 100, total: 1 }
        '400': { $ref: '#/components/responses/ParametroInvalido' }
        '429': { $ref: '#/components/responses/LimiteExcedido' }
        '503': { $ref: '#/components/responses/Indisponivel' }
components:
  headers:
    Limite:
      description: Cota conjunta de /indicadores, /series e /mapas/indicadores por IP e janela.
      schema: { type: integer, enum: [60] }
    Restantes:
      description: Chamadas restantes na janela atual, após este pedido.
      schema: { type: integer, minimum: 0, maximum: 59 }
    Reinicio:
      description: Fim da janela em segundos desde Unix epoch, UTC.
      schema: { type: integer, format: int64 }
  parameters:
    agregacao:
      name: agregacao
      in: query
      description: >-
        Somente com tipo=FREQUENCIA (US15-T03), que também exige linha, inicio e fim (até 31 dias).
        janela (padrão) pareia observada e programada por janela publicada; faixa (exige hora_inicio/hora_fim),
        dia e mes (hora opcional) agrupam por data operacional, somam contagens e recalculam
        passagens/h pela soma das durações. Nas agregações, inicio e fim são meias-noites de America/Sao_Paulo.
        Janela nula, lacuna de publicação ou conjuntos sobrepostos tornam o agregado null, com motivos.
        Também com tipo=REGULARIDADE_INTERVALOS (US17-T03A), com as mesmas exigências: o CV é
        recalculado sobre a união dos intervalos das janelas, nunca pela média dos CVs.
        Também com tipo=ESPERA (US18-T03A): espera estimada e excesso de espera recalculados
        sobre a união dos intervalos observados e programados das janelas.
      schema: { type: string, enum: [janela, faixa, dia, mes], default: janela }
    hora_inicio:
      name: hora_inicio
      in: query
      description: Início da faixa diária em America/Sao_Paulo; enviar junto com hora_fim. Omitir ambas para dia inteiro.
      schema: { type: string, pattern: '^(?:[01]\d|2[0-3]):[0-5]\d$' }
    hora_fim:
      name: hora_fim
      in: query
      description: Fim exclusivo da faixa diária. Menor que o início representa faixa noturna; horas iguais são inválidas.
      schema: { type: string, pattern: '^(?:[01]\d|2[0-3]):[0-5]\d$' }
    linha:
      name: linha
      in: query
      required: false
      description: Código da linha na versão GTFS; até 64 caracteres, sem controles.
      schema: { type: string, maxLength: 64 }
    sentido:
      name: sentido
      in: query
      required: false
      description: Sentido GTFS (0/ida ou 1/volta).
      schema: { type: string, enum: ['0', '1', ida, volta] }
    tipo:
      name: tipo
      in: query
      required: false
      description: >-
        Tipo de indicador; inclui PONTUALIDADE_VIAGENS, FREQUENCIA_OBSERVADA,
        FREQUENCIA_PROGRAMADA FREQUENCIA (observada e programada lado a lado,
        com agregacao) e REGULARIDADE_INTERVALOS (US17: CV dos intervalos entre
        passagens da oferta por frequência, por parada, com agregacao,
        agrupamento e motivo_ausencia). Na pontualidade, numerador conta saídas
        entre -60 s e +300 s, denominador inclui viagens fixas classificáveis;
        dados insuficientes são indicados em qualidade e valor null. Alias
        indicador preservado por compatibilidade.
      schema: { type: string, pattern: '^[A-Za-z0-9_.:-]{1,64}$' }
    indicador:
      name: indicador
      in: query
      required: false
      deprecated: true
      description: Alias legado de tipo; não envie junto com tipo.
      schema: { type: string, pattern: '^[A-Za-z0-9_.:-]{1,64}$' }
    parada:
      name: parada
      in: query
      required: false
      description: Código de parada GTFS; mutuamente exclusivo com trecho.
      schema: { type: string, maxLength: 64 }
    trecho:
      name: trecho
      in: query
      required: false
      description: UUID do trecho; mutuamente exclusivo com parada.
      schema: { type: string, format: uuid }
    versao_gtfs_id:
      name: versao_gtfs_id
      in: query
      required: false
      description: UUID da versão de rede GTFS usada no cálculo.
      schema: { type: string, format: uuid }
    inicio:
      name: inicio
      in: query
      required: false
      description: Limite inferior do período, ISO 8601 com fuso; seleciona períodos que cruzem a faixa consultada.
      schema: { type: string, format: date-time }
      example: '2026-11-23T00:00:00Z'
    fim:
      name: fim
      in: query
      required: false
      description: Limite superior (exclusivo) do período, ISO 8601 com fuso; deve ser igual ou posterior a inicio. Janelas que começam exatamente em fim não são retornadas; com fim igual a inicio, retorna as janelas que contêm esse instante.
      schema: { type: string, format: date-time }
      example: '2026-11-24T00:00:00Z'
    page:
      name: page
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 2147483647, default: 1 }
    page_size:
      name: page_size
      in: query
      required: false
      description: Máximo de 100 itens por página.
      schema: { type: integer, minimum: 1, maximum: 100, default: 100 }
  schemas:
    Qualidade:
      type: object
      additionalProperties: true
    Contagens:
      type: object
      required: [numerador, denominador]
      properties:
        numerador: { type: integer, minimum: 0, nullable: true }
        denominador: { type: integer, minimum: 0, nullable: true }
    Indicador:
      type: object
      required: [linha, sentido, tipo, indicador, valor, unidade, inicio, fim, versao_conjunto, versao_gtfs_id, contagens, qualidade]
      properties:
        linha: { type: string }
        sentido: { type: string, nullable: true, enum: ['0', '1'] }
        tipo: { type: string }
        indicador: { type: string }
        valor: { type: number, nullable: true, description: Valor numérico na unidade declarada; NULL quando não calculável. }
        unidade: { type: string, description: Unidade própria do indicador, por exemplo %, min, veiculos/h ou veiculos/km. }
        inicio: { type: string, format: date-time }
        fim: { type: string, format: date-time }
        parada: { type: string, nullable: true }
        trecho: { type: string, format: uuid, nullable: true }
        versao_conjunto: { type: string }
        versao_gtfs_id: { type: string, format: uuid }
        versao_correspondencia: { type: string, nullable: true }
        versao_calculo: { type: string, nullable: true }
        contagens: { $ref: '#/components/schemas/Contagens' }
        qualidade: { $ref: '#/components/schemas/Qualidade' }
        agregacao: { type: string, enum: [janela, faixa, dia, mes], description: Somente em tipo=FREQUENCIA, REGULARIDADE_INTERVALOS ou ESPERA. }
        referencia: { type: string, description: 'Data operacional (AAAA-MM-DD) ou mês (AAAA-MM); somente em tipo=FREQUENCIA, REGULARIDADE_INTERVALOS ou ESPERA.' }
        duracao_horas: { type: number, description: Soma das durações das janelas usadas como denominador. }
        observada: { $ref: '#/components/schemas/LadoFrequencia' }
        programada: { $ref: '#/components/schemas/LadoFrequencia' }
        agrupamento:
          type: boolean
          nullable: true
          description: 'Somente em tipo=REGULARIDADE_INTERVALOS: true só com CV > 0,5 (0,5 não é agrupamento); null sem CV.'
        limite_agrupamento: { type: number, example: 0.5 }
        situacao: { type: string, description: 'REGULARIDADE_INTERVALOS: CALCULADA, DADOS_INSUFICIENTES, DADOS_AUSENTES ou CONJUNTOS_INCOMPATIVEIS.' }
        motivo_ausencia:
          type: string
          nullable: true
          description: >-
            REGULARIDADE_INTERVALOS com valor null: passagens_insuficientes (menos de 3 passagens),
            media_invalida, oferta_sem_frequencia, lacuna_maxima_indefinida, coleta_<situação>,
            sem_evidencia_gps, estimativa_nao_executada, sem_publicacao ou janelas_sobrepostas.
        intervalos: { type: integer, nullable: true, description: 'Intervalos entre passagens usados no CV.' }
        media_intervalo_seg: { type: number, nullable: true }
        desvio_padrao_seg: { type: number, nullable: true, description: 'Desvio padrão populacional (divisor n).' }
        espera_estimada:
          description: >-
            Somente em tipo=ESPERA (US18-T01): E = Σh² ÷ (2·Σh) dos intervalos entre passagens, em min.
            valor null com motivo_ausencia (passagens_insuficientes, divisor_invalido, coleta_*, ...).
          $ref: '#/components/schemas/LadoEspera'
        excesso_espera:
          description: >-
            Somente em tipo=ESPERA (US18-T02): espera estimada − espera programada (ΣH² ÷ 2ΣH dos
            intervalos programados vigentes; H ÷ 2 com intervalo único), em min. Negativo é mantido.
            Sem intervalo programado: null com intervalo_programado_ausente.
          $ref: '#/components/schemas/LadoEspera'
    LadoEspera:
      type: object
      properties:
        valor: { type: number, nullable: true }
        unidade: { type: string, enum: [min] }
        situacao: { type: string, enum: [CALCULADA, DADOS_INSUFICIENTES, DADOS_AUSENTES, CONJUNTOS_INCOMPATIVEIS] }
        motivo_ausencia: { type: string, nullable: true }
        espera_programada_min: { type: number, nullable: true, description: Somente em excesso_espera. }
        intervalos_programados_seg: { type: array, items: { type: integer }, description: Somente em excesso_espera. }
    LadoFrequencia:
      type: object
      description: 'US15-T03: valor null nunca é zero; motivos e cobertura explicam a ausência.'
      properties:
        valor: { type: number, nullable: true }
        unidade: { type: string, example: passagens/h }
        contagem: { type: integer, nullable: true }
        situacao: { type: string, enum: [CALCULADA, ZERO_OBSERVADO, ZERO_PROGRAMADO, DADOS_AUSENTES, COBERTURA_PARCIAL, CONJUNTOS_INCOMPATIVEIS] }
        motivos: { type: array, items: { type: string } }
        cobertura: { type: object, additionalProperties: true }
    PontoSerie:
      type: object
      required: [id, status, instante, linha, sentido, tipo, indicador, valor, unidade, inicio, fim, versao_conjunto, versao_gtfs_id, contagens, qualidade]
      properties:
        id: { type: string }
        status: { type: string, enum: [DISPONIVEL, SEM_RESULTADO] }
        instante: { type: string, format: date-time }
        linha: { type: string }
        sentido: { type: string, nullable: true, enum: ['0', '1'] }
        tipo: { type: string }
        indicador: { type: string }
        valor: { type: number, nullable: true }
        unidade: { type: string, description: Unidade própria do indicador; nunca presumida pelo consumidor. }
        inicio: { type: string, format: date-time }
        fim: { type: string, format: date-time }
        parada: { type: string, nullable: true }
        trecho: { type: string, format: uuid, nullable: true }
        versao_conjunto: { type: string }
        versao_gtfs_id: { type: string, format: uuid }
        versao_correspondencia: { type: string, nullable: true }
        versao_calculo: { type: string, nullable: true }
        contagens: { $ref: '#/components/schemas/Contagens' }
        qualidade: { $ref: '#/components/schemas/Qualidade' }
        consolidado: { type: boolean, description: "US23-T03: a janela pertence a um dia já consolidado cuja consolidação recalculou este indicador; false = valor provisório da atualização de 15 min." }
        consolidado_em: { type: string, format: date-time, nullable: true }
    Paginacao:
      type: object
      required: [page, page_size, total]
      properties:
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer, description: Total de itens que correspondem aos filtros. }
    PaginaIndicadores:
      type: object
      required: [dados, paginacao]
      properties:
        dados:
          type: array
          description: >-
            Cada item traz também `consolidado` (boolean) e `consolidado_em`
            (date-time ou null), com a mesma regra de /series; agregações de vários
            dias só são consolidadas se todos os dias foram consolidados para o indicador.
          items: { $ref: '#/components/schemas/Indicador' }
        paginacao: { $ref: '#/components/schemas/Paginacao' }
        atualizacao: { $ref: '#/components/schemas/PaginaSeries/properties/atualizacao' }
        versao_dados: { $ref: '#/components/schemas/VersaoDados' }
    VersaoDados:
      type: object
      nullable: true
      description: >-
        US25-T01. Versão do conjunto exibido: a última publicação PRONTO da agenda
        US23-T03, lida na mesma transação dos dados. Enviar `id` como `versao_dados`
        em /downloads/indicadores. Null se ainda não houve publicação da agenda.
      required: [id, tipo, publicada_em, periodo_inicio, periodo_fim]
      properties:
        id: { type: string, format: uuid }
        tipo: { type: string, enum: [ATUALIZACAO_INDICADORES, CONSOLIDACAO_DIA] }
        publicada_em: { type: string, format: date-time }
        periodo_inicio: { type: string, format: date-time }
        periodo_fim: { type: string, format: date-time }
    PaginaSeries:
      type: object
      required: [dados, paginacao, lacunas, historico, consulta, atualizacao, versao_dados]
      properties:
        versao_dados: { $ref: '#/components/schemas/VersaoDados' }
        dados: { type: array, items: { $ref: '#/components/schemas/PontoSerie' } }
        paginacao: { $ref: '#/components/schemas/Paginacao' }
        lacunas:
          type: array
          maxItems: 200
          items:
            type: object
            required: [linha, sentido, tipo, unidade, inicio, fim, motivo]
            properties:
              linha: { type: string, nullable: true }
              sentido: { type: string, nullable: true }
              tipo: { type: string, nullable: true }
              unidade: { type: string, nullable: true }
              inicio: { type: string, format: date-time }
              fim: { type: string, format: date-time }
              motivo: { type: string, enum: [SEM_PUBLICACAO, RESULTADO_NULO] }
        historico:
          type: object
          required: [coleta_inicio, coleta_ultimo_ciclo, inicio_indicadores, fim_indicadores]
          properties:
            coleta_inicio: { type: string, format: date-time, nullable: true }
            coleta_ultimo_ciclo: { type: string, format: date-time, nullable: true }
            inicio_indicadores: { type: string, format: date-time, nullable: true }
            fim_indicadores: { type: string, format: date-time, nullable: true }
        consulta:
          type: object
          required: [inicio, fim, hora_inicio, hora_fim, fuso, lacunas_escopo, lacunas_truncadas, criterio_periodo]
          properties:
            inicio: { type: string, format: date-time, nullable: true }
            fim: { type: string, format: date-time, nullable: true }
            hora_inicio: { type: string, nullable: true }
            hora_fim: { type: string, nullable: true }
            fuso: { type: string, enum: [America/Sao_Paulo] }
            lacunas_escopo: { type: string, enum: [PAGINA] }
            lacunas_truncadas: { type: boolean }
            criterio_periodo: { type: string, enum: [JANELAS_INTEIRAMENTE_CONTIDAS] }
        atualizacao:
          type: object
          description: >-
            US23-T03. Agenda dos indicadores: a cada 15 min a última janela fechada é
            publicada; o dia D é consolidado a partir de 04:00 e até 06:00 de D+1
            (America/Sao_Paulo). Cada publicação é um conjunto gravado numa só
            transação, lido junto com os dados: a resposta nunca mistura uma
            atualização parcial com a anterior.
          required: [intervalo_minutos, ultima_atualizacao, proxima_atualizacao_prevista, consolidacao]
          properties:
            intervalo_minutos: { type: integer, enum: [15] }
            ultima_atualizacao:
              type: object
              nullable: true
              properties:
                janela_inicio: { type: string, format: date-time }
                janela_fim: { type: string, format: date-time }
                publicada_em: { type: string, format: date-time }
            proxima_atualizacao_prevista: { type: string, format: date-time, nullable: true }
            consolidacao:
              type: object
              properties:
                dia: { type: string, format: date, nullable: true }
                consolidado_ate: { type: string, format: date-time, nullable: true }
                consolidado_em: { type: string, format: date-time, nullable: true }
                no_prazo: { type: boolean, nullable: true }
                regra: { type: string }
    Erro:
      type: object
      required: [erro]
      properties:
        erro:
          type: object
          required: [codigo, mensagem]
          properties:
            codigo: { type: string }
            mensagem: { type: string }
            campo: { type: string }
            tentar_em_segundos: { type: integer, minimum: 1 }
  responses:
    LimiteExcedido:
      description: Orçamento de 60 chamadas por minuto por IP esgotado; respeitar Retry-After.
      headers:
        Retry-After:
          description: Segundos a aguardar antes de tentar novamente.
          schema: { type: integer, minimum: 1 }
        X-RateLimit-Limit: { $ref: '#/components/headers/Limite' }
        X-RateLimit-Remaining: { $ref: '#/components/headers/Restantes' }
        X-RateLimit-Reset: { $ref: '#/components/headers/Reinicio' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Erro' }
          example:
            erro:
              codigo: LIMITE_EXCEDIDO
              mensagem: Limite de 60 consultas por minuto por IP atingido. Aguarde e tente novamente.
              tentar_em_segundos: 30
    ParametroInvalido:
      description: Filtro desconhecido, repetido ou inválido.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Erro' }
          example:
            erro: { codigo: PARAMETRO_INVALIDO, mensagem: 'Informe um valor entre 1 e 100.', campo: page_size }
    Indisponivel:
      description: Consulta ou armazenamento compartilhado do limite indisponível. Sem liberar cota local substituta.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Erro' }
          example:
            erro: { codigo: CONSULTA_INDISPONIVEL, mensagem: 'Não foi possível consultar os indicadores. Tente novamente.' }
