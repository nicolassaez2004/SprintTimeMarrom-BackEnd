openapi: 3.0.3
info:
  title: API pública de indicadores — Auditoria Cidadã dos Ônibus de São Paulo
  version: 1.2.0
  description: >-
    Contrato para consulta pública, sem autenticação, de indicadores operacionais
    publicados e suas séries temporais. Sem valores publicados, as rotas retornam
    uma página vazia. Valores devem declarar unidade, janela, versão do conjunto
    e qualidade; os serviços produtores das dependências US14-T03B e US16-T02
    são responsáveis por gravar os valores calculados.
    GET e HEAD de /indicadores e /series compartilham 60 chamadas por IP por
    minuto UTC (janela fixa). A 61ª chamada retorna 429 com Retry-After em
    segundos. Parâmetros inválidos também consomem a cota; OPTIONS não consome.
    O IP vem da conexão; X-Forwarded-For só é considerado atrás de proxies
    explicitamente confiáveis. Falha no armazenamento do limite retorna 503.
    Guia público com exemplos e evidência de desempenho em /docs/indicadores.
servers:
  - url: http://localhost:5000
paths:
  /docs/indicadores:
    get:
      operationId: lerGuiaPublicoIndicadores
      summary: Guia público, exemplos de consumo e limites do ensaio HTTP.
      security: []
      responses:
        '200':
          description: Documentação HTML; não consome a cota de consultas.
          content:
            text/html:
              schema: { type: string }
  /docs/indicadores/openapi.yaml:
    get:
      operationId: baixarContratoIndicadores
      summary: Contrato OpenAPI versionado desta API.
      security: []
      responses:
        '200':
          description: Arquivo YAML; não consome a cota de consultas.
          content:
            application/yaml:
              schema: { type: string }
  /docs/indicadores/ensaio.json:
    get:
      operationId: lerEnsaioHTTPIndicadores
      summary: Amostra e ambiente do ensaio HTTP local com dados sintéticos.
      security: []
      responses:
        '200':
          description: Evidência estática versionada, não uma medição em tempo real da produção.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /indicadores:
    get:
      operationId: listarIndicadores
      summary: Consultar indicadores operacionais
      security: []
      parameters:
        - $ref: '#/components/parameters/linha'
        - $ref: '#/components/parameters/sentido'
        - $ref: '#/components/parameters/tipo'
        - $ref: '#/components/parameters/indicador'
        - $ref: '#/components/parameters/parada'
        - $ref: '#/components/parameters/trecho'
        - $ref: '#/components/parameters/versao_gtfs_id'
        - $ref: '#/components/parameters/inicio'
        - $ref: '#/components/parameters/fim'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/page_size'
      responses:
        '200':
          description: Página de indicadores publicados.
          headers:
            X-RateLimit-Limit: { $ref: '#/components/headers/Limite' }
            X-RateLimit-Remaining: { $ref: '#/components/headers/Restantes' }
            X-RateLimit-Reset: { $ref: '#/components/headers/Reinicio' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaIndicadores'
              example:
                dados:
                  - linha: '3762-10'
                    sentido: '0'
                    tipo: PONTUALIDADE_VIAGENS
                    indicador: PONTUALIDADE_VIAGENS
                    valor: 87.5
                    unidade: '%'
                    inicio: '2026-11-23T00:00:00Z'
                    fim: '2026-11-24T00:00:00Z'
                    parada: null
                    trecho: null
                    versao_conjunto: 'a02cbb7d2f77623f099e4d1192030e9b'
                    versao_gtfs_id: 'b2c21816-0b5b-4fac-9e14-2406fc7b591a'
                    versao_correspondencia: 'match-v3'
                    versao_calculo: 'cumprimento-1.0'
                    contagens: { numerador: 7, denominador: 8 }
                    qualidade: { dados_insuficientes: false, limite_adiantamento_segundos: 60, limite_atraso_segundos: 300, limites_inclusivos: true, excluidas: { frequencia: 2, sem_pareamento: 1, saida_nao_confirmada: 0 } }
                paginacao: { page: 1, page_size: 100, total: 1 }
        '400': { $ref: '#/components/responses/ParametroInvalido' }
        '429': { $ref: '#/components/responses/LimiteExcedido' }
        '503': { $ref: '#/components/responses/Indisponivel' }
  /series:
    get:
      operationId: consultarSeries
      summary: Consultar série temporal de indicador
      description: >-
        US23-T01. Somente janelas persistidas inteiramente contidas no período
        [inicio,fim) e na faixa diária em America/Sao_Paulo. Sem período consulta
        desde o início conhecido da coleta. consulta.inicio/fim são o período
        efetivo, recortado ao histórico (primeira coleta/indicador até o último
        ciclo/indicador); fora dele não há lacuna, e ambos são null quando o
        período pedido não cruza o histórico. Não recalcula nem fatia agregados.
        Zero é valor; null é ausência. Lacunas acompanham os registros da página,
        considerando registros anteriores à paginação e sobreposições. Até 200
        lacunas por página; consulta.lacunas_truncadas pede reduzir o período.
      security: []
      parameters:
        - $ref: '#/components/parameters/hora_inicio'
        - $ref: '#/components/parameters/hora_fim'
        - $ref: '#/components/parameters/linha'
        - $ref: '#/components/parameters/sentido'
        - $ref: '#/components/parameters/tipo'
        - $ref: '#/components/parameters/indicador'
        - $ref: '#/components/parameters/parada'
        - $ref: '#/components/parameters/trecho'
        - $ref: '#/components/parameters/versao_gtfs_id'
        - $ref: '#/components/parameters/inicio'
        - $ref: '#/components/parameters/fim'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/page_size'
      responses:
        '200':
          description: Página de pontos da série publicada.
          headers:
            X-RateLimit-Limit: { $ref: '#/components/headers/Limite' }
            X-RateLimit-Remaining: { $ref: '#/components/headers/Restantes' }
            X-RateLimit-Reset: { $ref: '#/components/headers/Reinicio' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaSeries'
              example:
                dados:
                  - instante: '2026-11-23T12:00:00Z'
                    id: '7c1beb67-96eb-4f1a-8043-b0ec9aeb75f0'
                    status: DISPONIVEL
                    inicio: '2026-11-23T12:00:00Z'
                    fim: '2026-11-23T13:00:00Z'
                    linha: '3762-10'
                    sentido: '0'
                    tipo: PONTUALIDADE_VIAGENS
                    indicador: PONTUALIDADE_VIAGENS
                    valor: 87.5
                    unidade: '%'
                    parada: null
                    trecho: null
                    versao_conjunto: '2026-11-v1'
                    versao_gtfs_id: 'b2c21816-0b5b-4fac-9e14-2406fc7b591a'
                    versao_correspondencia: 'match-v3'
                    versao_calculo: 'cumprimento-1.0'
                    contagens: { numerador: 7, denominador: 8 }
                    qualidade: { dados_insuficientes: false, limite_adiantamento_segundos: 60, limite_atraso_segundos: 300, limites_inclusivos: true, excluidas: { frequencia: 2, sem_pareamento: 1, saida_nao_confirmada: 0 } }
                paginacao: { page: 1, page_size: 100, total: 1 }
                lacunas: []
                historico: { coleta_inicio: null, coleta_ultimo_ciclo: null, inicio_indicadores: '2026-11-23T12:00:00Z', fim_indicadores: '2026-11-23T13:00:00Z' }
                consulta: { inicio: '2026-11-23T12:00:00Z', fim: '2026-11-23T13:00:00Z', hora_inicio: null, hora_fim: null, fuso: America/Sao_Paulo, lacunas_escopo: PAGINA, lacunas_truncadas: false, criterio_periodo: JANELAS_INTEIRAMENTE_CONTIDAS }
        '400': { $ref: '#/components/responses/ParametroInvalido' }
        '429': { $ref: '#/components/responses/LimiteExcedido' }
        '503': { $ref: '#/components/responses/Indisponivel' }
components:
  headers:
    Limite:
      description: Cota conjunta de /indicadores e /series por IP e janela.
      schema: { type: integer, enum: [60] }
    Restantes:
      description: Chamadas restantes na janela atual, após este pedido.
      schema: { type: integer, minimum: 0, maximum: 59 }
    Reinicio:
      description: Fim da janela em segundos desde Unix epoch, UTC.
      schema: { type: integer, format: int64 }
  parameters:
    hora_inicio:
      name: hora_inicio
      in: query
      description: Início da faixa diária em America/Sao_Paulo; enviar junto com hora_fim. Omitir ambas para dia inteiro.
      schema: { type: string, pattern: '^(?:[01]\d|2[0-3]):[0-5]\d$' }
    hora_fim:
      name: hora_fim
      in: query
      description: Fim exclusivo da faixa diária. Menor que o início representa faixa noturna; horas iguais são inválidas.
      schema: { type: string, pattern: '^(?:[01]\d|2[0-3]):[0-5]\d$' }
    linha:
      name: linha
      in: query
      required: false
      description: Código da linha na versão GTFS; até 64 caracteres, sem controles.
      schema: { type: string, maxLength: 64 }
    sentido:
      name: sentido
      in: query
      required: false
      description: Sentido GTFS (0/ida ou 1/volta).
      schema: { type: string, enum: ['0', '1', ida, volta] }
    tipo:
      name: tipo
      in: query
      required: false
      description: Tipo de indicador; inclui PONTUALIDADE_VIAGENS. Na pontualidade, numerador conta saídas entre -60 s e +300 s, denominador inclui viagens fixas classificáveis; dados insuficientes são indicados em qualidade e valor null. Alias indicador preservado por compatibilidade.
      schema: { type: string, pattern: '^[A-Za-z0-9_.:-]{1,64}$' }
    indicador:
      name: indicador
      in: query
      required: false
      deprecated: true
      description: Alias legado de tipo; não envie junto com tipo.
      schema: { type: string, pattern: '^[A-Za-z0-9_.:-]{1,64}$' }
    parada:
      name: parada
      in: query
      required: false
      description: Código de parada GTFS; mutuamente exclusivo com trecho.
      schema: { type: string, maxLength: 64 }
    trecho:
      name: trecho
      in: query
      required: false
      description: UUID do trecho; mutuamente exclusivo com parada.
      schema: { type: string, format: uuid }
    versao_gtfs_id:
      name: versao_gtfs_id
      in: query
      required: false
      description: UUID da versão de rede GTFS usada no cálculo.
      schema: { type: string, format: uuid }
    inicio:
      name: inicio
      in: query
      required: false
      description: Limite inferior do período, ISO 8601 com fuso; seleciona períodos que cruzem a faixa consultada.
      schema: { type: string, format: date-time }
      example: '2026-11-23T00:00:00Z'
    fim:
      name: fim
      in: query
      required: false
      description: Limite superior (exclusivo) do período, ISO 8601 com fuso; deve ser igual ou posterior a inicio. Janelas que começam exatamente em fim não são retornadas; com fim igual a inicio, retorna as janelas que contêm esse instante.
      schema: { type: string, format: date-time }
      example: '2026-11-24T00:00:00Z'
    page:
      name: page
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 2147483647, default: 1 }
    page_size:
      name: page_size
      in: query
      required: false
      description: Máximo de 100 itens por página.
      schema: { type: integer, minimum: 1, maximum: 100, default: 100 }
  schemas:
    Qualidade:
      type: object
      additionalProperties: true
    Contagens:
      type: object
      required: [numerador, denominador]
      properties:
        numerador: { type: integer, minimum: 0, nullable: true }
        denominador: { type: integer, minimum: 0, nullable: true }
    Indicador:
      type: object
      required: [linha, sentido, tipo, indicador, valor, unidade, inicio, fim, versao_conjunto, versao_gtfs_id, contagens, qualidade]
      properties:
        linha: { type: string }
        sentido: { type: string, nullable: true, enum: ['0', '1'] }
        tipo: { type: string }
        indicador: { type: string }
        valor: { type: number, nullable: true, description: Valor numérico na unidade declarada; NULL quando não calculável. }
        unidade: { type: string, description: Unidade própria do indicador, por exemplo %, min, veiculos/h ou veiculos/km. }
        inicio: { type: string, format: date-time }
        fim: { type: string, format: date-time }
        parada: { type: string, nullable: true }
        trecho: { type: string, format: uuid, nullable: true }
        versao_conjunto: { type: string }
        versao_gtfs_id: { type: string, format: uuid }
        versao_correspondencia: { type: string, nullable: true }
        versao_calculo: { type: string, nullable: true }
        contagens: { $ref: '#/components/schemas/Contagens' }
        qualidade: { $ref: '#/components/schemas/Qualidade' }
    PontoSerie:
      type: object
      required: [id, status, instante, linha, sentido, tipo, indicador, valor, unidade, inicio, fim, versao_conjunto, versao_gtfs_id, contagens, qualidade]
      properties:
        id: { type: string }
        status: { type: string, enum: [DISPONIVEL, SEM_RESULTADO] }
        instante: { type: string, format: date-time }
        linha: { type: string }
        sentido: { type: string, nullable: true, enum: ['0', '1'] }
        tipo: { type: string }
        indicador: { type: string }
        valor: { type: number, nullable: true }
        unidade: { type: string, description: Unidade própria do indicador; nunca presumida pelo consumidor. }
        inicio: { type: string, format: date-time }
        fim: { type: string, format: date-time }
        parada: { type: string, nullable: true }
        trecho: { type: string, format: uuid, nullable: true }
        versao_conjunto: { type: string }
        versao_gtfs_id: { type: string, format: uuid }
        versao_correspondencia: { type: string, nullable: true }
        versao_calculo: { type: string, nullable: true }
        contagens: { $ref: '#/components/schemas/Contagens' }
        qualidade: { $ref: '#/components/schemas/Qualidade' }
    Paginacao:
      type: object
      required: [page, page_size, total]
      properties:
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer, description: Total de itens que correspondem aos filtros. }
    PaginaIndicadores:
      type: object
      required: [dados, paginacao]
      properties:
        dados: { type: array, items: { $ref: '#/components/schemas/Indicador' } }
        paginacao: { $ref: '#/components/schemas/Paginacao' }
    PaginaSeries:
      type: object
      required: [dados, paginacao, lacunas, historico, consulta]
      properties:
        dados: { type: array, items: { $ref: '#/components/schemas/PontoSerie' } }
        paginacao: { $ref: '#/components/schemas/Paginacao' }
        lacunas:
          type: array
          maxItems: 200
          items:
            type: object
            required: [linha, sentido, tipo, unidade, inicio, fim, motivo]
            properties:
              linha: { type: string, nullable: true }
              sentido: { type: string, nullable: true }
              tipo: { type: string, nullable: true }
              unidade: { type: string, nullable: true }
              inicio: { type: string, format: date-time }
              fim: { type: string, format: date-time }
              motivo: { type: string, enum: [SEM_PUBLICACAO, RESULTADO_NULO] }
        historico:
          type: object
          required: [coleta_inicio, coleta_ultimo_ciclo, inicio_indicadores, fim_indicadores]
          properties:
            coleta_inicio: { type: string, format: date-time, nullable: true }
            coleta_ultimo_ciclo: { type: string, format: date-time, nullable: true }
            inicio_indicadores: { type: string, format: date-time, nullable: true }
            fim_indicadores: { type: string, format: date-time, nullable: true }
        consulta:
          type: object
          required: [inicio, fim, hora_inicio, hora_fim, fuso, lacunas_escopo, lacunas_truncadas, criterio_periodo]
          properties:
            inicio: { type: string, format: date-time, nullable: true }
            fim: { type: string, format: date-time, nullable: true }
            hora_inicio: { type: string, nullable: true }
            hora_fim: { type: string, nullable: true }
            fuso: { type: string, enum: [America/Sao_Paulo] }
            lacunas_escopo: { type: string, enum: [PAGINA] }
            lacunas_truncadas: { type: boolean }
            criterio_periodo: { type: string, enum: [JANELAS_INTEIRAMENTE_CONTIDAS] }
    Erro:
      type: object
      required: [erro]
      properties:
        erro:
          type: object
          required: [codigo, mensagem]
          properties:
            codigo: { type: string }
            mensagem: { type: string }
            campo: { type: string }
            tentar_em_segundos: { type: integer, minimum: 1 }
  responses:
    LimiteExcedido:
      description: Orçamento de 60 chamadas por minuto por IP esgotado; respeitar Retry-After.
      headers:
        Retry-After:
          description: Segundos a aguardar antes de tentar novamente.
          schema: { type: integer, minimum: 1 }
        X-RateLimit-Limit: { $ref: '#/components/headers/Limite' }
        X-RateLimit-Remaining: { $ref: '#/components/headers/Restantes' }
        X-RateLimit-Reset: { $ref: '#/components/headers/Reinicio' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Erro' }
          example:
            erro:
              codigo: LIMITE_EXCEDIDO
              mensagem: Limite de 60 consultas por minuto por IP atingido. Aguarde e tente novamente.
              tentar_em_segundos: 30
    ParametroInvalido:
      description: Filtro desconhecido, repetido ou inválido.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Erro' }
          example:
            erro: { codigo: PARAMETRO_INVALIDO, mensagem: 'Informe um valor entre 1 e 100.', campo: page_size }
    Indisponivel:
      description: Consulta ou armazenamento compartilhado do limite indisponível. Sem liberar cota local substituta.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Erro' }
          example:
            erro: { codigo: CONSULTA_INDISPONIVEL, mensagem: 'Não foi possível consultar os indicadores. Tente novamente.' }
